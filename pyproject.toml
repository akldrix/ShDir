[project]
name = "shdir"
version = "1.1.0"
description = "Share your files in local network with secure connection"
readme = "README.md"
authors = [{ name = "Rogov Anton", email = "akldrix@gmail.com" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<4.0"
keywords = [
  "file-sharing",
  "local-network",
  "secure-file-transfer",
  "fastapi",
  "cli-tool",
]

dependencies = [
  "aiofiles>=25.1.0",
  "annotated-doc>=0.0.5",
  "annotated-types>=0.8.0",
  "anyio>=4.15.1",
  "cffi>=2.1.1",
  "click>=8.5.0",
  "cryptography>=50.0.2",
  "dotenv>=0.9.9",
  "fastapi>=0.162.0",
  "h11>=0.16.0",
  "idna>=3.20",
  "Jinja2>=3.1.6",
  "markdown-it-py>=4.2.0",
  "MarkupSafe>=3.0.4",
  "mdurl>=0.1.2",
  "opentelemetry-api>=1.45.1",
  "pydantic>=2.14.1",
  "pydantic_core>=2.50.1",
  "Pygments>=2.21.0",
  "python-dotenv>=1.2.4",
  "python-multipart>=0.0.32",
  "qrcode>=8.2",
  "rich>=15.0.0",
  "shellingham>=1.5.4",
  "starlette>=1.10.0",
  "typer>=0.27.3",
  "typing-inspection>=0.4.4",
  "typing_extensions>=4.16.0",
  "uvicorn>=0.54.0",
  "zipstream-ng>=1.9.3",
]
[tool.poetry]
packages = [{ include = "shdir", from = "src" }]
include = [
  "src/shdir/templates/**/*",
  "src/shdir/static/**/*",
  "src/shdir/icons/**/*",
]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://github.com/akldrix/shdir"
Repository = "https://github.com/akldrix/shdir"
Documentation = "https://github.com/akldrix/shdir"

[project.scripts]
shdir = 'shdir.app:run_app'
